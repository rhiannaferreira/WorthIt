name: Deploy frontend to GitHub Pages

# Builds the app in frontend/ and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://rhiannaferreira.github.io/WorthIt/
on:
  push:
    branches: [feature/frontend]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Relative asset paths so the site works under /WorthIt/
      - name: Build
        working-directory: frontend
        run: npm run build -- --base=./

      - name: Publish to gh-pages branch
        working-directory: frontend/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
